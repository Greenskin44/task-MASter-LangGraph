[pytest]
# Pytest configuration for LangGraph project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Markers for categorizing tests
markers =
    studio: Tests for studio demonstration graphs
    deployment: Tests for deployment graphs
    email: Tests for email assistant workflows
    research: Tests for research agent workflows
    integration: Integration tests that use real API calls
    unit: Unit tests with mocked dependencies
    benchmark: Performance benchmark tests

# Ignore patterns
norecursedirs = .git .venv project-env __pycache__ *.egg-info

# Timeout for tests (in seconds)
timeout = 300

# Environment variables
env =
    PYTHONPATH=.
