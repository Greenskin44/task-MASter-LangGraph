name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    
    - name: Run Black (Code Formatting)
      run: black --check .
    
    - name: Run Ruff (Linting)
      run: ruff check .
    
    - name: Run MyPy (Type Checking)
      run: mypy graphs/ --ignore-missing-imports --no-strict-optional
      continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Create .env file
      run: |
        echo "OPENAI_API_KEY=test-key" > .env
        echo "LANGSMITH_API_KEY=test-key" >> .env
        echo "TAVILY_API_KEY=test-key" >> .env
    
    - name: Run pytest
      run: pytest tests/ -v --tb=short
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key' }}
        LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY || 'test-key' }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'test-key' }}

  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Create .env file
      run: |
        echo "OPENAI_API_KEY=test-key" > .env
        echo "LANGSMITH_API_KEY=test-key" >> .env
        echo "TAVILY_API_KEY=test-key" >> .env
    
    - name: Run benchmarks
      run: pytest tests/test_benchmarks.py --benchmark-only --benchmark-json=benchmark.json
      continue-on-error: true
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'test-key' }}
        LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY || 'test-key' }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || 'test-key' }}
    
    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      if: success()
      with:
        tool: 'pytest'
        output-file-path: benchmark.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: false
        comment-on-alert: true
        alert-threshold: '150%'
